[project]
name = "witty-accounting"
version = "0.1.0"
description = "Witty Accounting Backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pymysql",
    "pydantic",
    "pydantic-settings",
    "alembic",
    "apscheduler",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.0",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.7.0",
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
