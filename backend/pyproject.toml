[project]
name = "witty-accounting"
version = "0.1.0"
description = "Witty Accounting Backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pymysql",
    "pydantic",
    "pydantic-settings",
    "alembic",
    "apscheduler",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
